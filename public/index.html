<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiMo Sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #888; margin-top: 1rem; line-height: 1.6; }
    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 0.875rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MiMo Sandbox</h1>
    <p>Test page repository for MiMo Code builds.<br>Each page lives in its own folder under <code>/public/</code>.</p>
    <div class="status">✓ Deployed via Railway</div>
  </div>
</body>
</html>
